# 生产环境配置 - 使用环境变量占位符
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    operations-sorter: alpha
    enabled: false  # 生产环境关闭Swagger UI

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    timeout: ${DEEPSEEK_TIMEOUT:300}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    temperature: ${DEEPSEEK_TEMPERATURE:0.7}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:2000}

auto-publish:
  enabled: true
  schedule: 0 0 12-18 * * ?
  max-daily: 3

spring:
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:1776080295@qq.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESS:localhost}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: ${RABBITMQ_VHOST:/}
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/fuye?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DATASOURCE_USERNAME:yjymac}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    jwt:
      key: ${JWT_KEY:}
      expire: ${JWT_EXPIRE:72}
      limit:
        base: ${JWT_LIMIT_BASE:10}
        upgrade: ${JWT_LIMIT_UPGRADE:300}
        frequency: ${JWT_LIMIT_FREQUENCY:30}

tengxun:
  secretId: ${TENGXUN_SECRET_ID:}
  secretKey: ${TENGXUN_SECRET_KEY:}
  prodEvn: true

jimeng:
  accessKeyId: ${JIMENG_ACCESS_KEY_ID:}
  accessKeySecret: ${JIMENG_ACCESS_KEY_SECRET:}


logging:
  file:
    path: /opt/apps/your-springboot-app/my_project_ai/my-project-backend/log